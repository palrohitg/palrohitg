name: Update open-source PR tracker

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh pull-request tracker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TRACKER_AUTHOR: palrohitg
          PR_TRACKER_ORGS: OpenHands,SynthLuvr
          PR_TRACKER_LIMIT: "20"
        run: python scripts/update_pr_tracker.py

      - name: Commit updated tracker
        run: |
          if git diff --quiet -- README.md; then
            echo "Tracker is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh open-source PR tracker"
          git push
